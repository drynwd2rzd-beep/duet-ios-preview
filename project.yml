name: Duet
options:
  bundleIdPrefix: app.duet.preview
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Duet:
    type: application
    platform: iOS
    sources:
      - path: Duet
        excludes:
          - Web
          - Info.plist
      - path: Duet/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.duet.preview
        PRODUCT_NAME: Duet
        INFOPLIST_FILE: Duet/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Duet:
    build:
      targets:
        Duet: all
