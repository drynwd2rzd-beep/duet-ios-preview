<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Duet</title>
<script src="assets/lucide.js"></script><script src="local-state.js"></script>
<style>@font-face{font-family:'Cormorant Garamond';src:url('assets/cormorant.ttf') format('truetype');font-weight:400 500;font-style:normal;font-display:swap}svg.lucide{display:inline-block;vertical-align:middle;flex-shrink:0}button{cursor:pointer}button:disabled{cursor:default}</style>
</head><body>
<div id="duet-messenger">
 <main class="dm-phone" aria-label="iPhone 聊天 App 交互原型">
  <div class="dm-home-wallpaper" hidden aria-hidden="true"></div><div class="dm-chat-wallpaper" hidden aria-hidden="true"></div>
  <div class="dm-status" aria-hidden="true"><span>9:41</span><div class="dm-island"></div><span class="dm-status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
  <section class="dm-rootpage" data-page="chats">
   <header class="dm-title"><div><div class="dm-day">10 月 25 日，星期日</div><h1 class="dm-editorial-title">Chats</h1></div></header>
   <label class="dm-search"><i data-lucide="search" aria-hidden="true"></i><input aria-label="搜索会话" placeholder="搜索" autocomplete="off"></label>
   <div class="dm-threads" aria-label="会话列表">
    <button class="dm-thread cursor-interaction" data-thread="group"><span class="dm-avatar dm-group"><i data-lucide="users-round" aria-hidden="true"></i></span><span class="dm-thread-copy"><span class="dm-thread-heading"><strong>三人小组</strong><time>10:24</time></span><span class="dm-thread-preview">Claude：先把界面做好，再接入聊天。</span></span></button>
    <button class="dm-thread cursor-interaction" data-thread="gpt"><span class="dm-avatar dm-gpt"><i data-lucide="sparkles" aria-hidden="true"></i></span><span class="dm-thread-copy"><span class="dm-thread-heading"><strong>ChatGPT</strong><time>09:48</time></span><span class="dm-thread-preview">好的，我帮你把这个想法拆成几个步骤。</span></span></button>
    <button class="dm-thread cursor-interaction" data-thread="claude"><span class="dm-avatar dm-claude"><i data-lucide="asterisk" aria-hidden="true"></i></span><span class="dm-thread-copy"><span class="dm-thread-heading"><strong>Claude</strong><time>昨天</time></span><span class="dm-thread-preview">有灵感的时候，先记下来就好。</span></span></button>
   </div>
  </section>
  <section class="dm-rootpage" data-page="ideas" hidden>
   <header class="dm-title"><h1 class="dm-editorial-title">Ideas</h1><div class="dm-home-tools"><button class="dm-icon dm-glass cursor-interaction" data-action="open-settings" aria-label="打开设置"><i data-lucide="settings"></i></button><button class="dm-icon dm-glass cursor-interaction" data-action="new-idea" aria-label="记录想法"><i data-lucide="plus"></i></button></div></header>
   <div class="dm-filters" aria-label="想法筛选"><button class="cursor-interaction" data-filter="today" aria-pressed="true">今天</button><button class="cursor-interaction" data-filter="later" aria-pressed="false">以后</button><button class="cursor-interaction" data-filter="all" aria-pressed="false">全部</button></div>
   <div class="dm-ideas" aria-live="polite"></div>
  </section>
  <section class="dm-rootpage" data-page="settings" hidden>
   <header class="dm-title"><h1>设置</h1></header>
   <div class="dm-settings">
    <p class="dm-section-label">账号</p><button class="dm-setting-row cursor-interaction" data-action="accounts"><span class="dm-setting-icon"><i data-lucide="person-standing"></i></span><span>连接 AI 账号</span><small>未连接</small><i data-lucide="chevron-right"></i></button>
    <button class="dm-setting-row cursor-interaction" data-action="people"><span class="dm-setting-icon"><i data-lucide="contact-round"></i></span><span>管理伙伴</span><small>名字与头像</small><i data-lucide="chevron-right"></i></button>
    <button class="dm-setting-row cursor-interaction" data-action="personalization"><span class="dm-setting-icon"><i data-lucide="notebook-pen"></i></span><span>个性化与记忆</span><small>独立角色</small><i data-lucide="chevron-right"></i></button>
    <p class="dm-section-label">偏好</p><button class="dm-setting-row cursor-interaction" data-action="appearance"><span class="dm-setting-icon"><i data-lucide="palette"></i></span><span>外观与字体</span><small>主题色 · 纯色背景</small><i data-lucide="chevron-right"></i></button>
    <button class="dm-setting-row cursor-interaction" data-action="notifications"><span class="dm-setting-icon"><i data-lucide="bell"></i></span><span>提醒通知</span><small>原型预览</small><i data-lucide="chevron-right"></i></button>
    <button class="dm-setting-row cursor-interaction" data-action="automation"><span class="dm-setting-icon"><i data-lucide="repeat-2"></i></span><span>群聊自动讨论</span><small class="dm-round-value">2 轮</small><i data-lucide="chevron-right"></i></button>
    <p class="dm-settings-note">界面交互原型<br>当前不会向 AI 发送消息或触发系统通知。</p>
   </div>
  </section>
  <section class="dm-rootpage dm-personalization" data-page="personalization" hidden aria-label="伙伴个性化">
   <header class="dm-personal-nav"><button class="dm-back cursor-interaction" data-action="personalization-back"><i data-lucide="chevron-left" aria-hidden="true"></i>设置</button><strong>个性化</strong><span></span></header><div class="dm-personal-content"></div>
  </section>
  <section class="dm-detail" hidden aria-label="聊天窗口">
   <header class="dm-chat-nav"><button class="dm-back cursor-interaction" data-action="back" aria-label="返回会话列表"><i data-lucide="chevron-left"></i></button><div class="dm-chat-person"></div><div class="dm-chat-tools"><button class="dm-icon dm-glass cursor-interaction" data-action="search-chat" aria-label="搜索聊天记录"><i data-lucide="search"></i></button><button class="dm-icon dm-glass cursor-interaction" data-action="chat-menu" aria-label="会话选项"><i data-lucide="ellipsis"></i></button></div></header>
   <section class="dm-chat-search" hidden aria-label="搜索当前会话"><div class="dm-chat-search-top"><label><i data-lucide="search" aria-hidden="true"></i><input type="search" aria-label="搜索当前聊天" placeholder="搜索聊天记录" autocomplete="off"></label><button class="dm-icon cursor-interaction" data-action="close-chat-search" aria-label="关闭搜索"><i data-lucide="x"></i></button></div><div class="dm-chat-search-controls"><select aria-label="聊天搜索类型"><option value="all">全部</option><option value="text">文字</option><option value="photos">照片</option></select><input type="date" aria-label="聊天搜索日期"><span class="dm-chat-search-count" aria-live="polite"></span><button class="cursor-interaction" data-search-step="-1" aria-label="上一个结果"><i data-lucide="chevron-up"></i></button><button class="cursor-interaction" data-search-step="1" aria-label="下一个结果"><i data-lucide="chevron-down"></i></button></div></section>
   <div class="dm-transcript" aria-live="polite"></div>
   <footer class="dm-chat-footer"><div class="dm-mentions" hidden aria-label="选择提及的伙伴"></div><div class="dm-attachment-preview" hidden></div><div class="dm-recipient-bar" hidden aria-label="将回应的伙伴"></div><div class="dm-editing-bar" hidden><span>编辑消息</span><button class="cursor-interaction" data-action="cancel-edit-message" aria-label="取消编辑"><i data-lucide="x"></i></button></div><div class="dm-composer-wrap"><button class="dm-icon dm-glass cursor-interaction" data-action="attachments" aria-label="添加照片或想法"><i data-lucide="plus"></i></button><div class="dm-composer dm-glass"><textarea rows="1" aria-label="聊天消息" placeholder="发消息" autocomplete="off"></textarea><button class="dm-mention-trigger cursor-interaction" data-action="mention" aria-label="提及伙伴" hidden><i data-lucide="at-sign" aria-hidden="true"></i></button><button class="dm-send cursor-interaction" data-action="send" aria-label="发送消息"><i data-lucide="arrow-up"></i></button></div></div></footer>
  </section>
  <nav class="dm-tabs dm-glass" aria-label="主导航"><button class="cursor-interaction" data-tab="chats" aria-pressed="true" aria-label="聊天" data-tooltip="聊天"><i data-lucide="message-circle" aria-hidden="true"></i></button><button class="cursor-interaction" data-tab="ideas" aria-pressed="false" aria-label="想法" data-tooltip="想法"><i data-lucide="lightbulb" aria-hidden="true"></i></button></nav>
  <div class="dm-home" aria-hidden="true"></div>
  <section class="dm-attach-layer" hidden role="dialog" aria-label="添加内容菜单"><div class="dm-attach-scrim"></div><div class="dm-attach-card"><button class="dm-apple-action cursor-interaction" data-attach-action="camera"><span class="dm-apple-action-icon camera"><i data-lucide="camera" aria-hidden="true"></i></span><span>相机</span></button><button class="dm-apple-action cursor-interaction" data-attach-action="photos"><span class="dm-apple-action-icon photos"><i data-lucide="images" aria-hidden="true"></i></span><span>照片</span></button><button class="dm-apple-action cursor-interaction" data-attach-action="files"><span class="dm-apple-action-icon files"><i data-lucide="folder" aria-hidden="true"></i></span><span>文件</span></button><button class="dm-apple-action cursor-interaction" data-attach-action="idea"><span class="dm-apple-action-icon idea"><i data-lucide="lightbulb" aria-hidden="true"></i></span><span>想法</span></button></div></section>
  <section class="dm-sheet" hidden aria-label="选项面板"><div class="dm-scrim"></div><div class="dm-sheet-card"><div class="dm-grabber"></div><header class="dm-sheet-header"><h2>记录想法</h2><button class="dm-icon cursor-interaction" data-action="close" aria-label="关闭面板"><i data-lucide="x"></i></button></header><div class="dm-sheet-content"></div></div></section>
  <section class="dm-lightbox" hidden role="dialog" aria-modal="true" aria-label="照片大图"><header class="dm-lightbox-top"><button class="dm-lightbox-close cursor-interaction" aria-label="关闭大图"><i data-lucide="x" aria-hidden="true"></i></button><span class="dm-lightbox-count"></span><span class="dm-lightbox-spacer"></span></header><div class="dm-lightbox-stage"><img class="dm-lightbox-image" alt="照片" draggable="false"></div><div class="dm-lightbox-thumbs" aria-label="切换照片"></div><div class="dm-lightbox-home" aria-hidden="true"></div></section>
  <div class="dm-undo" hidden role="status"><span>已移除想法</span><button class="cursor-interaction" data-undo-idea>撤销</button></div>
  <div class="dm-feedback" hidden role="status" aria-live="polite"></div>
  <input type="file" class="dm-file" id="dm-photo-file" accept="image/*" multiple aria-label="选择多张照片" hidden>
  <input type="file" class="dm-file" id="dm-avatar-file" accept="image/*" aria-label="选择头像照片" hidden>
  <input type="file" class="dm-file" id="dm-camera-file" accept="image/*" capture="environment" aria-label="拍摄照片" hidden>
  <input type="file" class="dm-file" id="dm-document-file" aria-label="选择文件" multiple hidden>
  <section class="dm-camera" hidden role="dialog" aria-modal="true" aria-label="实时相机"><header><button class="dm-camera-icon cursor-interaction" data-camera-action="close" aria-label="关闭相机"><i data-lucide="x"></i></button><span>相机</span><button class="dm-camera-icon cursor-interaction" data-camera-action="flip" aria-label="切换镜头"><i data-lucide="switch-camera"></i></button></header><div class="dm-camera-stage"><video autoplay playsinline muted></video><img alt="拍摄预览" hidden><div class="dm-camera-fallback" hidden><i data-lucide="camera-off" aria-hidden="true"></i><p>当前预览无法使用摄像头</p><button class="cursor-interaction" data-camera-action="system">打开系统相机</button><button class="cursor-interaction" data-camera-action="album">选择照片</button></div></div><footer><button class="dm-camera-text cursor-interaction" data-camera-action="retake" hidden>重拍</button><button class="dm-shutter cursor-interaction" data-camera-action="capture" aria-label="拍摄照片"><span></span></button><button class="dm-camera-text cursor-interaction" data-camera-action="use" hidden>使用照片</button></footer></section>
  <input type="file" class="dm-file" id="dm-wallpaper-file" accept="image/*" aria-label="选择背景图片" hidden>
 </main>
</div>
<style>
#duet-messenger{--m-bg:light-dark(#fff,#111113);--m-fg:light-dark(#151517,#f5f5f7);--m-secondary:light-dark(#818187,#a1a1aa);--m-subtle:light-dark(#f2f2f7,#232326);--m-line:light-dark(#e7e7ec,#303034);--m-glass:light-dark(#ffffffe0,#29292de8);--m-edge:light-dark(#fffffff2,#ffffff25);--m-shadow:light-dark(#20203010,#0005);--m-blue:light-dark(#007aff,#4196ff);--m-bubble:light-dark(#e9e9eb,#303034);--m-white:#fff;--m-orange:light-dark(#a85942,#e3ac98);padding:24px 10px 28px;display:grid;place-items:center;color:var(--m-fg);color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Microsoft YaHei',sans-serif}#duet-messenger *{box-sizing:border-box}#duet-messenger [hidden]{display:none!important}#duet-messenger button,#duet-messenger input,#duet-messenger textarea,#duet-messenger select{font:inherit}#duet-messenger button{background:none;border:0;color:inherit;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}#duet-messenger button:focus-visible,#duet-messenger input:focus-visible,#duet-messenger textarea:focus-visible,#duet-messenger select:focus-visible{outline:2px solid var(--m-blue);outline-offset:3px}#duet-messenger .dm-phone{position:relative;isolation:isolate;width:min(100%,402px);min-width:0;border:1px solid var(--m-line);background:var(--m-bg);border-radius:44px;box-shadow:0 20px 60px var(--m-shadow);overflow:hidden;padding-bottom:1px}#duet-messenger .dm-status{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:relative;font-size:14px;font-weight:600}#duet-messenger .dm-island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:105px;height:28px;background:#09090a;border-radius:30px}#duet-messenger .dm-status-icons{display:flex;gap:4px}#duet-messenger .dm-status-icons svg{width:15px;height:15px}#duet-messenger .dm-rootpage{min-height:611px}#duet-messenger .dm-title{display:flex;align-items:center;justify-content:space-between;padding:24px 22px 17px}#duet-messenger h1{font-size:33px;line-height:1.15;letter-spacing:-.8px;font-weight:650;margin:0}#duet-messenger .dm-icon{width:44px;height:44px;border-radius:50%;flex-shrink:0}#duet-messenger .dm-icon svg{width:21px;height:21px;stroke-width:1.7}#duet-messenger .dm-glass{background:var(--m-glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:inset 0 1px 0 var(--m-edge),0 2px 9px var(--m-shadow);border:1px solid light-dark(#dcdce36b,#ffffff16)}#duet-messenger .dm-title .dm-icon{color:var(--m-blue)}#duet-messenger .dm-search{display:flex;align-items:center;gap:7px;border-radius:12px;padding:10px 12px;background:var(--m-subtle);margin:0 20px 19px}#duet-messenger .dm-search svg{width:18px;height:18px;color:var(--m-secondary)}#duet-messenger input,#duet-messenger textarea{color:var(--m-fg);background:none;outline:none;border:0;width:100%;min-width:0;font-size:16px;line-height:1.5}#duet-messenger input::placeholder,#duet-messenger textarea::placeholder{color:var(--m-secondary)}#duet-messenger .dm-search input{line-height:1.25}#duet-messenger .dm-thread{width:100%;text-align:left;justify-content:start;gap:13px;padding:0 0 0 20px;min-height:88px}#duet-messenger .dm-avatar{width:54px;height:54px;flex-shrink:0;border-radius:50%;display:grid;place-items:center}#duet-messenger .dm-avatar svg{width:26px;height:26px;stroke-width:1.5}#duet-messenger .dm-group{background:light-dark(#e8effb,#20314a);color:var(--m-blue)}#duet-messenger .dm-gpt{background:light-dark(#f0f0f2,#2d2d31);color:var(--m-fg)}#duet-messenger .dm-claude{background:light-dark(#f7ebe5,#382821);color:var(--m-orange)}#duet-messenger .dm-thread-copy{display:grid;gap:6px;min-width:0;flex:1;padding:21px 20px 21px 0;border-bottom:1px solid var(--m-line);align-self:stretch}#duet-messenger .dm-thread-heading{display:flex;align-items:center;gap:8px}#duet-messenger .dm-thread-heading strong{font-size:16px;font-weight:600}#duet-messenger  root.addEventListener('pointermove',e=>{const d=state.stackDrag;if(!d||d.pointer!==e.pointerId)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.horizontal&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){state.stackDrag=null;return}if(!d.horizontal&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){d.horizontal=true;d.button.setPointerCapture(e.pointerId)}if(!d.horizontal)return;e.preventDefault();dragStack(d,dx)});
 function finishStackSwipe(e,cancel=false){const d=state.stackDrag;if(!d||d.pointer!==e.pointerId)return;state.stackDrag=null;if(!d.horizontal)return;state.suppressPhotoClickUntil=performance.now()+240;const commit=!cancel&&(Math.abs(d.dx)>35||Math.abs(d.dx)>16&&Math.abs(d.vx||0)>.45);refreshStack(d.button,commit?(d.dx<0?1:-1):0)}
 root.addEventListener('pointerup',e=>finishStackSwipe(e));root.addEventListener('pointercancel',e=>finishStackSwipe(e,true));
 const lightbox=root.querySelector('.dm-lightbox');lightbox.querySelector('.dm-lightbox-close').addEventListener('click',closeLightbox);lightbox.querySelector('.dm-lightbox-thumbs').addEventListener('click',e=>{const b=e.target.closest('[data-large-index]');if(b&&state.gallery)openGallery(state.gallery.photos,Number(b.dataset.largeIndex))});
 function applyGalleryTransform(){const image=lightbox.querySelector('.dm-lightbox-image');image.style.transform='translate('+state.galleryPan.x+'px,'+state.galleryPan.y+'px) scale('+state.galleryZoom+')';image.classList.toggle('zoomed',state.galleryZoom>1)}
 const galleryStage=lightbox.querySelector('.dm-lightbox-stage');
 galleryStage.addEventListener('dblclick',()=>{cancelPhotoFlight();clearGalleryNeighbor();const image=lightbox.querySelector('.dm-lightbox-image'),before=image.style.transform||'scale(1)';state.galleryZoom=state.galleryZoom>1?1:2.2;state.galleryPan={x:0,y:0};applyGalleryTransform();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)image.animate([{transform:before},{transform:image.style.transform}],{duration:230,easing:'ease-out'})});
 galleryStage.addEventListener('pointerdown',e=>{if(state.lightboxClosing)return;cancelPhotoFlight();clearGalleryNeighbor();for(const animation of lightbox.querySelector('.dm-lightbox-image').getAnimations())animation.cancel();state.galleryPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});galleryStage.setPointerCapture(e.pointerId);if(state.galleryPointers.size===1){state.galleryDrag={x:e.clientX,y:e.clientY,pan:{...state.galleryPan},pointer:e.pointerId};state.galleryPinched=false}else if(state.galleryPointers.size===2){const a=[...state.galleryPointers.values()];state.galleryPinched=true;state.galleryPinch={distance:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),zoom:state.galleryZoom,center:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},pan:{...state.galleryPan}}}});
 galleryStage.addEventListener('pointermove',e=>{if(!state.galleryPointers.has(e.pointerId))return;state.galleryPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.galleryPointers.size===2){const a=[...state.galleryPointers.values()],p=state.galleryPinch;if(!p)return;state.galleryZoom=Math.max(1,Math.min(4,p.zoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/p.distance));state.galleryPan={x:p.pan.x+(a[0].x+a[1].x)/2-p.center.x,y:p.pan.y+(a[0].y+a[1].y)/2-p.center.y};applyGalleryTransform();return}const d=state.galleryDrag;if(!d||state.galleryPinched)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(state.galleryZoom>1){const maxX=galleryStage.clientWidth*(state.galleryZoom-1)/2,maxY=galleryStage.clientHeight*(state.galleryZoom-1)/2;state.galleryPan={x:Math.max(-maxX,Math.min(maxX,d.pan.x+dx)),y:Math.max(-maxY,Math.min(maxY,d.pan.y+dy))};applyGalleryTransform()}else dragGalleryImage(dx,dy)});
 function endGalleryPointer(e,cancel=false){state.galleryPointers.delete(e.pointerId);if(state.galleryPinched){clearGalleryNeighbor();if(!state.galleryPointers.size){state.galleryPinched=false;state.galleryDrag=null}applyGalleryTransform();return}const d=state.galleryDrag;state.galleryDrag=null;if(!d||!state.gallery)return;if(!cancel&&state.galleryZoom<=1){const dx=e.clientX-d.x,dy=e.clientY-d.y;if(dy>70&&dy>Math.abs(dx)){closeLightbox();return}if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)&&state.gallery.photos.length>1){const g=state.gallery,direction=dx<0?1:-1;state.gallerySlideDirection=direction;state.gallerySlideFrom=dx+direction*(galleryStage.clientWidth+18);openGallery(g.photos,(g.index+(dx<0?1:g.photos.length-1))%g.photos.length);return}}clearGalleryNeighbor();const image=lightbox.querySelector('.dm-lightbox-image'),before=image.style.transform;applyGalleryTransform();if(motionAllowed()&&before)image.animate([{transform:before},{transform:image.style.transform}],{duration:200,easing:'ease-out'})}
 galleryStage.addEventListener('pointerup',e=>endGalleryPointer(e));galleryStage.addEventListener('pointercancel',e=>endGalleryPointer(e,true));
 root.querySelector('[data-action="close"]').addEventListener('click',close);root.querySelector('.dm-scrim').addEventListener('click',close);root.addEventListener('keydown',e=>{if(!lightbox.hidden){if(e.key==='Escape')closeLightbox();if(['ArrowLeft','ArrowRight'].includes(e.key)&&state.gallery){e.preventDefault();const g=state.gallery;state.gallerySlideDirection=e.key==='ArrowRight'?1:-1;openGallery(g.photos,(g.index+(e.key==='ArrowRight'?1:g.photos.length-1))%g.photos.length)}}else if(e.key==='Escape')close()});
 window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data&&Array.isArray(data.ideas)&&data.ideas.length<=50){state.ideas=data.ideas.filter(x=>x&&typeof x.title==='string'&&typeof x.id==='string');if(state.page==='ideas')renderIdeas()}});
 initPremiumInteractions();
 showPage(state.page,false);
 window.addEventListener('duet:native-ready',publishNativeShell);
 window.addEventListener('duet:native-command',event=>{const command=event.detail||{};if(command.action==='tab'&&['chats','ideas'].includes(command.tab)){showPage(command.tab);publishNativeShell()}if(command.action==='camera-photo'&&typeof command.url==='string'&&command.url.startsWith('data:image/jpeg;base64,')&&command.url.length<16*1024*1024){const thread=state.nativeCameraThread;if(!thread)return;state.attachments[thread].push({url:command.url,name:'拍摄的照片.jpg'});if(state.thread===thread)renderAttachments();nativePost({type:'haptic',style:'success'})}});
 root.addEventListener('click',event=>{if(event.target.closest('[data-attach-action="camera"]')&&window.webkit?.messageHandlers?.duet){event.preventDefault();event.stopImmediatePropagation();state.nativeCameraThread=state.thread;closeAttachmentMenu(true);nativePost({type:'camera'})}},true);
 const nativeShellObserver=new MutationObserver(()=>publishNativeShell());nativeShellObserver.observe(root.querySelector('.dm-sheet'),{attributes:true,attributeFilter:['hidden']});nativeShellObserver.observe(root.querySelector('.dm-lightbox'),{attributes:true,attributeFilter:['hidden']});
 window.duetUIReady=true;
 publishNativeShell();

})();
