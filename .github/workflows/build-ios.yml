name: Build Native iPhone IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Compile and test native iPhone app
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate native sources
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 scripts/validate.py
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Compile native IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-ipa.sh
      - name: Upload native IPA
        uses: actions/upload-artifact@v4
        with:
          name: Duet-native-ipa
          path: |
            build/Duet-Native-unsigned.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Test native UI on iPhone simulator
        timeout-minutes: 20
        run: bash scripts/test-native.sh
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-screenshots
          path: build/native-ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics
          path: |
            build/xcodebuild.log
            build/native-tests.log
            build/Build.xcresult
            build/NativeUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
